name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main halfway through a deploy; PR runs may be superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      pages: ${{ github.event_name == 'push' }}

  deploy:
    needs: checks
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ needs.deploy.outputs.url }}
      EXPECT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Wait until the CDN serves this commit
        run: |
          for _ in $(seq 1 40); do
            curl -fsS "$BASE_URL" | grep -q "name=\"piotrobonk-version\" content=\"[^\"]* $EXPECT_SHA\"" && exit 0
            sleep 15
          done
          echo "::error::$BASE_URL still does not serve $EXPECT_SHA"
          exit 1
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 > /dev/null
      - run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-live
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
