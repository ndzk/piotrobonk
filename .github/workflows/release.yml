name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be on main and match package.json
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          version="v$(node -p 'require("./package.json").version')"
          [ "$version" = "$GITHUB_REF_NAME" ] || { echo "::error::package.json says $version, tag is $GITHUB_REF_NAME"; exit 1; }

  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The exact offline build that passed the checks above.
      - uses: actions/download-artifact@v8
        with:
          name: offline
          path: piotrobonk-${{ github.ref_name }}
      - run: zip -9r "piotrobonk-$TAG-offline.zip" "piotrobonk-$TAG"
      - name: Release notes
        run: |
          prev=$(git describe --tags --match 'v*' --abbrev=0 "$TAG^" 2>/dev/null || true)
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          {
            echo "## Zmiany"
            echo
            git log --no-merges --pretty='- %s (%h)' "${prev:+$prev..}$TAG"
            echo
            echo "Graj online: $url"
            echo "Offline: rozpakuj zip i otwórz \`piotrobonk-$TAG/index.html\` w przeglądarce."
          } > RELEASE_NOTES.md
      - name: Publish
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "piotrobonk-$TAG-offline.zip" --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            pre=""
            case "$TAG" in *-*) pre="--prerelease" ;; esac
            gh release create "$TAG" "piotrobonk-$TAG-offline.zip" --verify-tag $pre --title "PIOTROBONK $TAG" --notes-file RELEASE_NOTES.md
          fi
