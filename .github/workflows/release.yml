name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:offline
      - name: Zip offline build
        run: |
          cd dist-offline
          zip -9r "../piotrobonk-${GITHUB_REF_NAME}-offline.zip" .
      - name: Changelog from commits
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          range=${prev:+$prev..}$GITHUB_REF_NAME
          {
            echo "## Zmiany"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
            echo
            echo "Graj online: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo "Offline: rozpakuj zip i otwórz index.html w przeglądarce."
          } > RELEASE_NOTES.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "piotrobonk-${GITHUB_REF_NAME}-offline.zip" --title "PIOTROBONK $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
