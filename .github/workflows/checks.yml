# Every quality gate in one reusable job. Called by CI (push/PR) and by Release, so nothing ships unchecked.
name: Checks

on:
  workflow_call:
    inputs:
      pages:
        description: Upload dist/ as the GitHub Pages artifact
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    # Pinned: on ubuntu-26.04 Playwright's WebKit has no libicu74 and SwiftShader stalls a run (all red).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The in-game changelog is built from the git history.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size
      - run: npm run build:offline
      - uses: actions/upload-artifact@v7
        with:
          name: offline
          path: dist-offline/
          retention-days: 14
      # The link preview (og:image 1200×630): the real title screen of this very build.
      - id: playwright
        if: inputs.pages
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: inputs.pages
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: npx playwright install --with-deps chromium
        if: inputs.pages
      - run: node scripts/og-image.ts dist
        if: inputs.pages
      - uses: actions/upload-pages-artifact@v5
        if: inputs.pages
        with:
          path: dist

  # The e2e suite on five browsers, side by side (one runner for the whole suite took 15-30 minutes, and past 30 it
  # was cancelled with the deploy; see POSTMORTEM.md): Chromium, which runs the logic tests, in three parts.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, shard: 1/3, browser: chromium }
          - { project: chromium, shard: 2/3, browser: chromium }
          - { project: chromium, shard: 3/3, browser: chromium }
          - { project: android, shard: 1/1, browser: chromium }
          - { project: firefox, shard: 1/1, browser: firefox }
          - { project: webkit, shard: 1/1, browser: webkit }
          - { project: iphone, shard: 1/1, browser: webkit }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:offline
      - id: playwright
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.browser }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libegl1 > /dev/null
      - run: xvfb-run -a npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-${{ matrix.project }}-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  # The balance gate (BALANCE.md, scripts/sim/gate.ts): the difficulty spec checked on fixed seeds by the headless
  # simulation, which the replay parity test (e2e/replay.spec.ts) proves is the game. Red here blocks the deploy.
  balance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sim/gate.ts --watki=4 --tylko=snap,budget,cs,alone,exploits

  # The slow half of the gate: the oracle may not kill any boss under its minimum (the strongest stored loadout and
  # the Red Team's single-target build), and the Human and Casual bots must land in their bands. Planner runs cost
  # minutes each, so it runs one station per runner beside the rest, and one small job checks the bands over all of
  # them; red here blocks the deploy too.
  balance-bots:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        station: [fabryczna, niciarniana, widzew, andrzejow, bedon, justynow, galkowek, zakowice, koluszki]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sim/gate.ts --watki=4 --tylko=boss,bots --stacje=${{ matrix.station }} --zrzut=bots-${{ matrix.station }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: bots-${{ matrix.station }}
          path: bots-${{ matrix.station }}.json

  balance-bands:
    needs: balance-bots
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v8
        with:
          pattern: bots-*
          path: widelki
      - run: node scripts/sim/gate.ts --tylko=widelki --z=widelki
