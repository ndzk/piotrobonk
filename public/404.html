<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nie ma takiej stacji · PIOTROBONK</title>
    <meta name="theme-color" content="#141a45" />
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: linear-gradient(#141a45, #4b3a78 55%, #c86a63);
        color: #f5f1ea;
        font: 500 18px/1.4 'Barlow Condensed', system-ui, sans-serif;
      }
      .board {
        width: min(560px, 100%);
        background: #0b0f24;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgb(0 0 0 / 0.5);
        animation: rise 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
      }
      .head { background: #0d3b8c; color: #fff; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 8px 16px; }
      .row { display: flex; justify-content: space-between; gap: 16px; padding: 14px 16px; color: #ffc83a; font-size: 22px; letter-spacing: 0.06em; }
      .status { color: #ff5a3c; font-weight: 700; }
      p { margin: 0; padding: 0 16px 18px; }
      a {
        display: inline-block;
        margin: 0 16px 18px;
        padding: 10px 18px;
        border-radius: 4px;
        background: #ffd400;
        color: #111;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
      }
      a:hover, a:focus-visible { filter: brightness(1.12); outline: 3px solid #fff; outline-offset: 2px; }
      @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
      @media (prefers-reduced-motion: reduce) { .board { animation: none; } }
    </style>
  </head>
  <body>
    <main class="board">
      <div class="head">Odjazdy</div>
      <div class="row"><span>Nie ma takiej stacji</span><span class="status">404</span></div>
      <p>Ten adres prowadzi donikąd. Tory też ktoś pewnie ukradł.</p>
      <a id="home" href="/">Wracam na peron</a>
    </main>
    <script>
      // Works under /piotrobonk/ on github.io and at the root of a custom domain.
      var m = location.pathname.match(/^\/piotrobonk\//);
      document.getElementById('home').href = m ? m[0] : '/';
    </script>
  </body>
</html>
