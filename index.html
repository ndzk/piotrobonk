    <style>
      #boot-fail {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        place-items: center;
        padding: 24px;
        background: #0b0f24;
        color: #f5f1ea;
        font: 500 18px/1.4 system-ui, sans-serif;
        text-align: center;
      }
      #boot-fail.show {
        display: grid;
      }
      #boot-fail > div {
        max-width: 520px;
        border-top: 6px solid #ffd400;
        padding-top: 16px;
      }
      #boot-fail h1 {
        margin: 0 0 8px;
        color: #ffd400;
        font-size: 30px;
      }
    </style>
    <noscript><style>#boot-fail { display: grid; }</style></noscript>
  </head>
  <body>
    <div id="boot-fail" role="alert">
      <div>
        <h1>Gra się nie załadowała</h1>
        <p>Odśwież stronę. Jeśli to nie pomoże, zaktualizuj przeglądarkę i sprawdź, czy JavaScript jest włączony.</p>
      </div>
    </div>
    <script>
      // Boot watchdog: shows #boot-fail when the bundle fails to download or parse. The bundle cancels it on start.
      (function () {
        var show = function () {
          var box = document.getElementById('boot-fail');
          if (box && !document.documentElement.hasAttribute('data-boot')) box.className = 'show';
        };
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show();
            else if (e.filename && e.filename.indexOf('/assets/') >= 0) show();
          },
          true,
        );
        // On a slow connection the 1.5 MB bundle can take longer than any fixed timeout: give up only once the
        // script has arrived and still not started for a while, or after a minute and a half either way.
        var since = 0;
        var check = function () {
          var done = performance.getEntriesByType('resource').some(function (r) {
            return r.name.indexOf('/assets/index-') >= 0 && r.name.slice(-3) === '.js' && r.responseEnd > 0;
          });
          if (done) since += 3;
          if (since >= 12 || performance.now() > 90000) show();
          else if (!document.documentElement.hasAttribute('data-boot')) setTimeout(check, 3000);
        };
        setTimeout(check, 3000);
      })();
    </script>
    <canvas id="scene"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
