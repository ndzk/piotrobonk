<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>PIOTROBONK · porównanie postaci</title>
    <style>
      body { margin: 0; background: #141a2e; color: #f1ece4; font: 600 16px/1.2 'Barlow Condensed', system-ui, sans-serif; }
      .sheet { display: grid; gap: 18px; padding: 18px; width: max-content; }
      .row { display: grid; grid-template-columns: 260px 300px repeat(4, 220px) 340px; gap: 10px; align-items: start; }
      .cell { display: grid; gap: 6px; }
      .cell span { color: #ffd400; letter-spacing: 0.06em; text-transform: uppercase; font-size: 14px; }
      .photo { width: 260px; height: 340px; object-fit: cover; border-radius: 6px; }
      canvas { border-radius: 6px; display: block; }
      .faces { display: grid; grid-template-columns: repeat(2, 165px); gap: 10px; }
      h2 { margin: 0; font-size: 26px; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <div class="sheet" id="sheet"></div>
    <script type="module" src="/src/dev/characters.ts"></script>
  </body>
</html>
